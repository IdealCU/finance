<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideal Credit Union - Debit Card Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-blue-900 text-white p-6 text-center">
            <h1 class="text-xl font-bold tracking-wide">Ideal Credit Union</h1>
            <p class="text-sm text-blue-200 mt-1">Debit Card Activation & Security Setup</p>
        </div>

        <!-- Form Container -->
        <div class="p-6">
            <form id="activationForm" onsubmit="handleActivation(event)" class="space-y-4">
                
                <!-- Cardholder Name -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Cardholder Name</label>
                    <input type="text" id="cardName" value="Tommy R Simpson" required 
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 bg-slate-50">
                </div>

                <!-- Card Number -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Debit Card Number (16 Digits)</label>
                    <input type="text" id="cardNumber" placeholder="4000 0000 0000 0000" maxlength="19" required 
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>

                <!-- Expiry & CVV -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Expiry (MM/YY)</label>
                        <input type="text" id="expiry" placeholder="12/28" maxlength="5" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">CVV Security Code</label>
                        <input type="password" id="cvv" placeholder="123" maxlength="3" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                </div>

                <!-- Verification Step: PIN Setup -->
                <div class="border-t border-slate-200 pt-4 mt-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Create 4-Digit Debit PIN</label>
                    <input type="password" id="pin" placeholder="****" maxlength="4" pattern="\d{4}" required 
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-center text-xl tracking-widest">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" 
                    class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition duration-200">
                    Activate Card & Verify PIN
                </button>
            </form>

            <!-- Status Output -->
            <div id="statusMessage" class="mt-4 p-3 rounded-lg text-sm text-center hidden font-semibold"></div>
        </div>
    </div>

    <script>
        function handleActivation(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = "Processing Verification...";

            statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');

            // Automatically pass validation for any number entered
            statusMessage.classList.add('bg-green-100', 'text-green-700');
            statusMessage.textContent = "Verification complete! Connecting...";
            
            // Redirect to "#" so you can input your link later
            setTimeout(() => {
                window.location.href = 'info.html';
                
                // Reset button state in case the page does not reload
                submitBtn.disabled = false;
                submitBtn.textContent = "Activate Card & Verify PIN";
                statusMessage.classList.add('hidden');
                document.getElementById('activationForm').reset();
                document.getElementById('cardName').value = "Tommy R Simpson";
            }, 1500);
        }
    </script>
</body>
</html>
